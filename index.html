<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sleeping Museum — Le Musée endormi</title>
<style>
:root{
  --bg:#081420; --panel:#0d2032; --panel2:#122c44; --line:#1d4160;
  --ink:#dceaf5; --ink-dim:#8fb0c6; --gold:#e9b95c; --teal:#6fe0b8;
  --danger:#ff6b5e; --beam:#cfe3f7;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-sans:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column}

/* ---------- screens ---------- */
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}

/* ---------- home ---------- */
#home{align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;
  background:radial-gradient(120% 90% at 50% -10%,#14304a 0%,#081420 62%)}
#home .stars{position:absolute;inset:0;pointer-events:none;opacity:.5}
#home h1{font-family:var(--font-serif);font-size:clamp(30px,7vw,54px);letter-spacing:.5px;color:#f2e9d4;
  text-shadow:0 0 24px rgba(233,185,92,.35),0 2px 0 #0007}
#home h1 small{display:block;font-size:.42em;font-style:italic;color:var(--ink-dim);letter-spacing:2px;margin-top:8px;text-shadow:none}
#home .tag{color:var(--ink-dim);max-width:34em;font-size:clamp(13px,2.6vw,16px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:12px;padding:12px 26px;
  font-size:17px;letter-spacing:.4px;box-shadow:0 4px 14px #0007,inset 0 1px 0 #ffffff14;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{border-color:#7a5a26;background:linear-gradient(180deg,#3a2f16,#2b2210);color:var(--gold);font-size:19px}
.btn.small{padding:8px 14px;font-size:14px;border-radius:9px}
#home .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#home footer{position:absolute;bottom:10px;width:100%;color:#5f7d93;font-size:12px}
.gemdot{display:inline-block;width:12px;height:12px;border-radius:3px;transform:rotate(45deg);margin:0 3px}

/* ---------- rules ---------- */
#rules{padding:18px;overflow:auto}
#rules .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#rules h2{font-family:var(--font-serif);color:#f2e9d4}
#rules p{color:var(--ink);line-height:1.55;font-size:15px}
#rules .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#rules table{width:100%;border-collapse:collapse;font-size:14px}
#rules td{padding:4px 6px;border-bottom:1px solid #16324a;color:var(--ink-dim)}
#rules td:first-child{color:var(--ink);white-space:nowrap;font-family:monospace}

/* ---------- levels ---------- */
#levels{padding:18px;overflow:auto}
#levels .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#levels h2{font-family:var(--font-serif);color:#f2e9d4}
#levels .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);text-align:left;transition:border-color .15s}
.lvl:not(.locked):hover{border-color:var(--gold)}
.lvl.locked{opacity:.45;cursor:default}
.lvl .n{font-family:var(--font-serif);font-size:20px;color:#f2e9d4}
.lvl .nm{font-size:13px;color:var(--ink-dim);min-height:2.2em}
.lvl .meta{font-size:12px;color:var(--gold);margin-top:4px;min-height:1.2em}

/* ---------- game ---------- */
#game{padding:0}
#hud{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#hud .lvlname{font-family:var(--font-serif);color:#f2e9d4;font-size:16px;white-space:nowrap}
#hud .stat{display:flex;align-items:center;gap:5px;background:#0a1a2b;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:14px;color:var(--ink-dim)}
#hud .stat b{color:var(--ink);font-weight:600}
#hud .stat .par{color:var(--gold)}
#hud .grow{flex:1}
#hud .iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:17px;display:inline-flex;align-items:center;justify-content:center}
#hud .iconbtn:active{transform:scale(.95)}
#hud .iconbtn.off{opacity:.45}
#boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;position:relative;background:radial-gradient(130% 100% at 50% 0%,#0d2438 0%,#081420 70%)}
canvas#board{border-radius:10px;box-shadow:0 10px 40px #000a,0 0 0 1px #1d4160}
#plaque{max-width:640px;margin:0 auto 8px;text-align:center;font-style:italic;color:var(--ink-dim);font-size:13px;padding:4px 14px}
#plaque::before{content:'— ';color:var(--gold)}#plaque::after{content:' —';color:var(--gold)}
#controls{display:flex;gap:14px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);align-items:center;justify-content:center}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px}
#dpad button{border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));font-size:20px;box-shadow:0 3px 8px #0006}
#dpad button:active{transform:scale(.93);background:#1a3a58}
#dpad .blank{visibility:hidden}
#actbtns{display:flex;flex-direction:column;gap:6px;min-width:130px}
#actbtns .btn{padding:9px 12px;font-size:14px}
#actbtns .k{color:var(--ink-dim);font-size:11px;margin-left:4px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#04101bcc;backdrop-filter:blur(2px);z-index:5}
#overlay.show{display:flex}
#overlay .panel{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:22px 30px;text-align:center;max-width:86%;box-shadow:0 14px 50px #000c;animation:pop .25s ease-out}
#overlay h2{font-family:var(--font-serif);color:#f2e9d4;font-size:26px;margin-bottom:6px}
#overlay .sub{color:var(--ink-dim);font-size:15px;margin-bottom:14px}
#overlay .medal{font-size:34px;margin:2px 0 8px}
#overlay .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#flash{position:absolute;inset:0;background:var(--danger);opacity:0;pointer-events:none;z-index:4}
@media (max-height:560px){#dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}#actbtns .btn{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="home">
    <div class="stars"></div>
    <h1 data-i="title">The Sleeping Museum<small data-i="titleSmall">a turn-based stealth puzzle</small></h1>
    <div class="tag" data-i="tagline"></div>
    <div class="row">
      <button class="btn primary" id="btnPlay" data-i="play">Play</button>
      <button class="btn" id="btnLevels" data-i="levels">Levels</button>
      <button class="btn" id="btnRules" data-i="rules">Rules</button>
    </div>
    <div class="row">
      <button class="btn small" id="btnLang">🌐 EN</button>
      <button class="btn small" id="btnSound">🔊</button>
    </div>
    <footer data-i="creditsLine"></footer>
  </div>

  <div class="screen" id="rules">
    <div class="inner">
      <h2 data-i="rulesTitle"></h2>
      <div id="rulesBody"></div>
      <div class="card" id="rulesControls"></div>
      <button class="btn" id="btnRulesBack" data-i="back">Back</button>
    </div>
  </div>

  <div class="screen" id="levels">
    <div class="inner">
      <h2 data-i="levels"></h2>
      <div class="grid" id="levelsGrid"></div>
      <button class="btn" id="btnLevelsBack" data-i="back">Back</button>
    </div>
  </div>

  <div class="screen" id="game">
    <div id="hud">
      <button class="iconbtn" id="btnHome" title="Home">⌂</button>
      <span class="lvlname" id="hudLevel"></span>
      <span class="stat" id="hudMoves"></span>
      <span class="stat" id="hudGems"></span>
      <span class="stat" id="hudDecoy" title="decoy"></span>
      <span class="grow"></span>
      <button class="iconbtn" id="btnRestart" title="restart">↺</button>
      <button class="iconbtn" id="btnRules2" title="rules">?</button>
      <button class="iconbtn" id="btnSound2" title="sound">🔊</button>
      <button class="iconbtn" id="btnLang2" title="language">EN</button>
    </div>
    <div id="boardwrap">
      <canvas id="board"></canvas>
      <div id="flash"></div>
      <div id="overlay"><div class="panel" id="overlayPanel"></div></div>
    </div>
    <div id="plaque"></div>
    <div id="controls">
      <div id="dpad">
        <div class="blank"></div><button data-mv="N">▲</button><div class="blank"></div>
        <button data-mv="W">◀</button><div class="blank"></div><button data-mv="E">▶</button>
        <div class="blank"></div><button data-mv="S">▼</button><div class="blank"></div>
      </div>
      <div id="actbtns">
        <button class="btn" id="btnWait">⏳ <span data-i="wait">Wait</span><span class="k">Space</span></button>
        <button class="btn" id="btnDecoy">✨ <span data-i="decoy">Decoy</span><span class="k">L</span></button>
        <button class="btn" id="btnUndo">↩ <span data-i="undo">Undo</span><span class="k">U</span></button>
      </div>
    </div>
  </div>

</div>
<script>
"use strict";
/* ============================================================
   LE MUSÉE ENDOURMI — turn-based stealth puzzle
   Engine (pure, deterministic) + solver + trilingual UI.
   No external resources. Audio synthesized. © 2026 MIT.
   ============================================================ */
const VERSION = "1.0.0";
const DIRS = { N:[0,-1], E:[1,0], S:[0,1], W:[-1,0] };
const DIRNAMES = ["N","E","S","W"];

function dirBetween(a,b){
  const dx=b[0]-a[0], dy=b[1]-a[1];
  if (dx=== 1) return "E"; if (dx===-1) return "W";
  if (dy=== 1) return "S"; if (dy===-1) return "N";
  return "S";
}
function rectPath(x1,y1,x2,y2){ // clockwise perimeter loop from (x1,y1)
  const c=[];
  for(let x=x1;x<=x2;x++) c.push([x,y1]);
  for(let y=y1+1;y<=y2;y++) c.push([x2,y]);
  for(let x=x2-1;x>=x1;x--) c.push([x,y2]);
  for(let y=y2-1;y>=y1+1;y--) c.push([x1,y]);
  return c;
}
function linePath(x1,y1,x2,y2){
  const c=[], dx=Math.sign(x2-x1), dy=Math.sign(y2-y1);
  let x=x1,y=y1;
  c.push([x,y]);
  while(x!==x2||y!==y2){ x+=dx; y+=dy; c.push([x,y]); }
  return c;
}
function pingPong(cells){ return cells.concat(cells.slice(1,cells.length-1).reverse()); }

/* ---------------- levels ----------------
   map legend: # wall · . floor · V vitrine (blocks move+sight)
               P player start · E exit · o enchanted object
   guards: {rect:[x1,y1,x2,y2]} | {path:[[x,y],…]}         → patroller (loop)
           {sentry:[x,y], faces:["N",…]}                    → rotating statue (cycle)  */
const LEVELS = [
{ name:{en:"First steps",fr:"Premiers pas",es:"Primeros pasos"},
  hint:{en:"Read the guard's lantern, then cross when the way is clear.",
        fr:"Lis la lanterne du gardien, puis traverse quand la voie est libre.",
        es:"Observa el farol del guardia y cruza cuando esté libre."},
  map:[
  "#########",
  "#o..#...#",
  "#.P.#...#",
  "#...#...#",
  "#.......#",
  "#...#.E.#",
  "#########"],
  guards:[ {rect:[5,1,7,5]} ] },

{ name:{en:"Glass shadows",fr:"Ombres de verre",es:"Sombras de cristal"},
  hint:{en:"Tall display cases block the guards' view.",
        fr:"Les grandes vitrines bloquent la vue des gardiens.",
        es:"Las vitrinas grandes bloquean la vista de los guardias."},
  map:[
  "###########",
  "#.........#",
  "#.P.V..o..#",
  "#...V.....#",
  "#....o....#",
  "#....E....#",
  "###########"],
  guards:[ {rect:[1,1,9,5]} ] },

{ name:{en:"The stone gaze",fr:"Le regard de pierre",es:"La mirada de piedra"},
  hint:{en:"The stone statue turns on the spot. Move while it looks away.",
        fr:"La statue de pierre tourne sur place. Déplace-toi quand elle regarde ailleurs.",
        es:"La estatua gira sobre sí misma. Muévete cuando mire a otro lado."},
  map:[
  "###########",
  "#....o....#",
  "#.V.....V.#",
  "#.........#",
  "#.o.......#",
  "#.........#",
  "#.P..E....#",
  "###########"],
  guards:[ {sentry:[5,3],faces:["N","E","S","W"]},
           {path:pingPong(linePath(3,5,7,5))} ] },

{ name:{en:"The decoy",fr:"Le leurre",es:"El señuelo"},
  hint:{en:"Use your decoy (✨) before entering this corridor: freezing the nearest guard for two turns opens your only safe window to cross.",
        fr:"Sers-toi du leurre (✨) avant d'entrer dans ce couloir : geler le gardien le plus proche pendant deux tours t'ouvre la seule fenêtre pour passer.",
        es:"Usa tu señuelo (✨) antes de entrar en este pasillo: congelar al guardia más cercano durante dos turnos te abre la única ventana para cruzar."},
  map:[
  "###########",
  "#..#......#",
  "#.P#......#",
  "#.........#",
  "#..#......#",
  "#..#.o.E..#",
  "###########"],
  guards:[ {sentry:[9,3],faces:["W","W","W","W","N"]} ] },

{ name:{en:"Night rounds",fr:"La ronde de nuit",es:"La ronda nocturna"},
  hint:{en:"Two patrols. Use the tall cases as cover and cross on the beat.",
        fr:"Deux rondes. Sers-toi des grandes vitrines comme abri et croise au bon tempo.",
        es:"Dos rondas. Usa las vitrinas como cobertura y cruza al ritmo justo."},
  map:[
  "#############",
  "#.....V.....#",
  "#.o...V...o.#",
  "#.....V.....#",
  "#.....V.....#",
  "#.o.........#",
  "#.P.......E.#",
  "#############"],
  guards:[ {rect:[1,1,11,6]},
           {path:pingPong(linePath(3,5,10,5))} ] },

{ name:{en:"The reserves",fr:"Les réserves",es:"Las reservas"},
  hint:{en:"Narrow aisles, a turning statue, a patrol. Plan the whole loop before you move.",
        fr:"Des allées étroites, une statue qui tourne, une ronde. Planifie toute la boucle avant d'avancer.",
        es:"Pasillos estrechos, una estatua giratoria y una ronda. Planifica todo el circuito antes de moverte."},
  map:[
  "#############",
  "#..V..o..V..#",
  "#..V.....V..#",
  "#...........#",
  "#..V.....V..#",
  "#..V..o..V..#",
  "#P.........E#",
  "#.o.......o.#",
  "#############"],
  guards:[ {sentry:[6,3],faces:["N","E","S","W"]},
           {path:pingPong(linePath(2,7,10,7))} ] },

{ name:{en:"The great hall",fr:"Le grand hall",es:"El gran vestíbulo"},
  hint:{en:"Three patrols in step. Break the rhythm — a well-placed wait is worth ten moves.",
        fr:"Trois rondes synchronisées. Casse le rythme — une attente bien placée vaut dix déplacements.",
        es:"Tres rondas sincronizadas. Rompe el ritmo: una espera bien colocada vale diez movimientos."},
  map:[
  "#############",
  "#o.........o#",
  "#.V.V.o.V.V.#",
  "#...........#",
  "#.P.........#",
  "#...........#",
  "#.V.V...V.V.#",
  "#....E......#",
  "#############"],
  guards:[ {path:pingPong(linePath(1,3,11,3))},
           {path:pingPong(linePath(11,5,1,5))},
           {path:pingPong(linePath(6,1,6,7))} ] },

{ name:{en:"The treasure",fr:"Le trésor",es:"El tesoro"},
  hint:{en:"Everything you have learned, in one vault. Few moves, no mistakes.",
        fr:"Tout ce que tu as appris, dans une seule salle. Peu de coups, aucune erreur.",
        es:"Todo lo aprendido, en una sola sala. Pocos movimientos, sin errores."},
  map:[
  "#############",
  "#.o..V..o...#",
  "#....V......#",
  "#...........#",
  "#.V.......V.#",
  "#...........#",
  "#...V....o..#",
  "#.P......o.E#",
  "#############"],
  guards:[ {sentry:[6,4],faces:["N","E","S","W"]},
           {path:pingPong(linePath(1,3,11,3))},
           {path:pingPong(linePath(11,5,1,5))},
           {rect:[1,1,11,7]} ] },
];

/* ---------------- engine ---------------- */
function parseLevel(def){
  const h=def.map.length, w=def.map[0].length;
  const walls=new Set(), vitrines=new Set(), objects=[];
  let player=null, exit=null;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=def.map[y][x];
    if(ch==="#") walls.add(x+","+y);
    else if(ch==="V") vitrines.add(x+","+y);
    else if(ch==="P") player={x,y};
    else if(ch==="E") exit={x,y};
    else if(ch==="o") objects.push({x,y});
  }
  const guards=def.guards.map(g=>{
    if(g.rect) return {type:"patrol", cells:rectPath(...g.rect)};
    if(g.path) return {type:"patrol", cells:g.path};
    return {type:"sentry", at:g.sentry.slice(), faces:g.faces.slice()};
  });
  if(!player||!exit) throw new Error("level needs P and E");
  return {w,h,walls,vitrines,objects,player,exit,guards};
}
function initState(base){
  const guards=base.guards.map(g=>{
    if(g.type==="patrol"){
      const next=g.cells[1%g.cells.length];
      return {type:"patrol",cells:g.cells,idx:0,facing:dirBetween(g.cells[0],next),distract:0,pos:g.cells[0].slice()};
    }
    return {type:"sentry",at:g.at,faces:g.faces,idx:0,facing:g.faces[0],distract:0,pos:g.at.slice()};
  });
  return { w:base.w,h:base.h,base,
    player:{...base.player}, exit:{...base.exit},
    objects:base.objects.map((o,i)=>({x:o.x,y:o.y,got:false,i})),
    gotMask:0, fullMask:(1<<base.objects.length)-1,
    guards, decoy:1, moves:0, turn:0, status:"playing" };
}
function cloneState(s){
  return { w:s.w,h:s.h,base:s.base, player:{...s.player}, exit:{...s.exit},
    objects:s.objects.map(o=>({...o})), gotMask:s.gotMask, fullMask:s.fullMask,
    guards:s.guards.map(g=>({type:g.type,cells:g.cells,at:g.at,faces:g.faces,idx:g.idx,facing:g.facing,distract:g.distract,pos:g.pos.slice()})),
    decoy:s.decoy, moves:s.moves, turn:s.turn, status:s.status };
}
function advanceGuard(g){ // one guard phase; returns false if frozen (distracted)
  if(g.distract>0){ g.distract--; return false; }
  if(g.type==="patrol"){
    const n=(g.idx+1)%g.cells.length;
    g.facing=dirBetween(g.cells[g.idx],g.cells[n]);
    g.idx=n; g.pos=g.cells[n].slice();
  }else{
    g.idx=(g.idx+1)%g.faces.length;
    g.facing=g.faces[g.idx];
  }
  return true;
}
function guardRay(state,g){ // watched cells of one guard (facing ray; walls & vitrines block)
  const out=[]; const [dx,dy]=DIRS[g.facing];
  let x=g.pos[0]+dx, y=g.pos[1]+dy;
  while(x>=0&&y>=0&&x<state.w&&y<state.h){
    const k=x+","+y;
    if(state.base.walls.has(k)||state.base.vitrines.has(k)) break;
    out.push([x,y]); x+=dx; y+=dy;
  }
  return out;
}
function watchedBy(state){ // per-guard arrays (distracted guards watch nothing)
  return state.guards.map(g=> g.distract>0? [] : guardRay(state,g));
}
function watchedSet(state){
  const s=new Set();
  for(const ray of watchedBy(state)) for(const [x,y] of ray) s.add(x+","+y);
  return s;
}
/* action: {t:"move",dx,dy} | {t:"wait"} | {t:"decoy"} */
function applyAction(state,action){
  if(state.status!=="playing") return {ok:false,reason:"over"};
  const ev=[];
  if(action.t==="move"){
    const nx=state.player.x+action.dx, ny=state.player.y+action.dy;
    if(nx<0||ny<0||nx>=state.w||ny>=state.h) return {ok:false,reason:"blocked"};
    const k=nx+","+ny;
    if(state.base.walls.has(k)||state.base.vitrines.has(k)) return {ok:false,reason:"blocked"};
    state.player={x:nx,y:ny}; state.moves++;
    ev.push({t:"step"});
    for(const g of state.guards) if(g.pos[0]===nx&&g.pos[1]===ny){
      state.status="captured"; ev.push({t:"capture-contact"}); return {ok:true,captured:true,won:false,events:ev};
    }
    const oi=state.objects.findIndex(o=>!o.got&&o.x===nx&&o.y===ny);
    if(oi>=0){ state.objects[oi].got=true; state.gotMask|=1<<oi; ev.push({t:"pickup",i:oi}); }
    if(nx===state.exit.x&&ny===state.exit.y&&state.gotMask===state.fullMask){
      state.status="won"; ev.push({t:"win"}); return {ok:true,captured:false,won:true,events:ev};
    }
  }else if(action.t==="wait"){
    state.moves++; ev.push({t:"wait"});
  }else if(action.t==="decoy"){
    if(state.decoy<=0) return {ok:false,reason:"nodecoy"};
    state.decoy--; state.moves++;
    let best=-1,bd=1e9;
    state.guards.forEach((g,i)=>{
      const d=Math.abs(g.pos[0]-state.player.x)+Math.abs(g.pos[1]-state.player.y);
      if(d<bd){bd=d;best=i;}
    });
    state.guards[best].distract=3; // this turn's phase + the two next turns
    ev.push({t:"decoy",guard:best});
  }else return {ok:false,reason:"badaction"};
  for(const g of state.guards) advanceGuard(g);
  for(const g of state.guards) if(g.pos[0]===state.player.x&&g.pos[1]===state.player.y){
    state.status="captured"; ev.push({t:"capture-contact"}); return {ok:true,captured:true,won:false,events:ev};
  }
  if(watchedSet(state).has(state.player.x+","+state.player.y)){
    state.status="captured"; ev.push({t:"capture-spotted"}); return {ok:true,captured:true,won:false,events:ev};
  }
  state.turn++;
  return {ok:true,captured:false,won:false,events:ev};
}

/* ---------------- solver (BFS, optimal) ---------------- */
const ACTS=[["up","move",{dx:0,dy:-1}],["down","move",{dx:0,dy:1}],["left","move",{dx:-1,dy:0}],["right","move",{dx:1,dy:0}],["wait","wait",{}],["decoy","decoy",{}]];
function solve(def,opts){
  opts=opts||{};
  const allowDecoy=opts.allowDecoy!==false;
  const root=initState(parseLevel(def));
  const keyOf=s=>s.player.x+","+s.player.y+"|"+s.gotMask+"|"+s.decoy+"|"+s.guards.map(g=>g.idx+"."+g.distract).join(";");
  const seen=new Set([keyOf(root)]);
  let frontier=[{s:root,path:[]}];
  const maxDepth=opts.maxDepth||200, maxNodes=opts.maxNodes||500000;
  for(let depth=0;depth<maxDepth&&frontier.length;depth++){
    const next=[];
    for(const node of frontier){
      for(const [name,t,payload] of ACTS){
        if(name==="decoy"&&(!allowDecoy||node.s.decoy<=0)) continue;
        const s2=cloneState(node.s);
        const r=applyAction(s2,{t,...payload});
        if(!r.ok||r.captured) continue;
        const p2=node.path.concat([name]);
        if(r.won) return {solvable:true,moves:p2.length,path:p2};
        const k=keyOf(s2);
        if(seen.has(k)) continue;
        seen.add(k);
        if(seen.size>maxNodes) return {solvable:false,reason:"nodecap"};
        next.push({s:s2,path:p2});
      }
    }
    frontier=next;
  }
  return {solvable:false};
}

/* precomputed par (verified by tests == solve()); recomputed only with ?debug=1 */
const PARS=[12,14,16,12,24,27,30,38];
function computePars(){ LEVELS.forEach((d,i)=>{const r=solve(d);PARS[i]=r.solvable?r.moves:null;}); computePars.done=true; }
if(typeof location!=="undefined"&&new URLSearchParams(location.search).has("debug")) computePars();

function tone(f0,f1,dur,type,vol,delay){
  if(!sound) return; const a=ac(); if(!a) return;
  try{
    const t0=a.currentTime+(delay||0);
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t0);

    g.gain.exponentialRampToValueAtTime(vol||0.12,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}

/* ---------- game flow ---------- */
function startLevel(i){
  curLevel=i; const base=parseLevel(LEVELS[i]);
  state=initState(base); undoStack=[]; particles=[]; captureFx=null; wonFx=null; lastResult=null;
  inputLockUntil=performance.now()+280; // avale les touches maintenues/répétées autour du redémarrage
  vis={player:{...state.player},guards:state.guards.map(g=>({x:g.pos[0],y:g.pos[1]}))};
  $("overlay").classList.remove("show");
  sizeCanvas(); updateHUD(); renderPlaque(); show("game"); draw(performance.now());
}
function doAction(action){
  if(!state||state.status!=="playing") return;
  const snap=cloneState(state);
  const r=applyAction(state,action);
  if(!r.ok){ SFX.blocked(); nudge(action); return; }
  lastResult=r; undoStack.push(snap); if(undoStack.length>300) undoStack.shift();
  for(const e of r.events){
    if(e.t==="step") SFX.step();
    if(e.t==="wait") SFX.wait();
    if(e.t==="pickup"){ SFX.pickup(); burst(state.player.x,state.player.y,GEMCOLORS[e.i%GEMCOLORS.length]); }
    if(e.t==="decoy") SFX.decoy();
    if(e.t==="capture-contact"||e.t==="capture-spotted"){
      SFX.caught(); shake=reduced?0:10; captureFx={t:performance.now(),contact:e.t==="capture-contact"};
    }
    if(e.t==="win"){ SFX.win(); burst(state.exit.x,state.exit.y,"#58e6a8"); wonFx={t:performance.now()}; }
  }
  animT={t0:performance.now(),dur:reduced?0:120};
  updateHUD();
  if(r.captured){ setTimeout(()=>{ if(state&&state.status==="captured") showCaptured(); },reduced?250:650); }
  else if(r.won){ setTimeout(()=>{ if(state&&state.status==="won") showClear(); },reduced?200:700); }
}
function nudge(action){ // tiny visual feedback for refused move
  if(action.t==="move"){ shake=reduced?0:3; }
}
function undo(){
  if(!undoStack.length||!state||state.status!=="playing") return;
  state=undoStack.pop(); SFX.undo(); lastResult=null;
  vis={player:{...state.player},guards:state.guards.map(g=>({x:g.pos[0],y:g.pos[1]}))};
  updateHUD();
}

/* ---------- canvas ---------- */
let cssW=0,cssH=0,dpr=1;
function sizeCanvas(){
  if(!state) return;
  const wrap=$("boardwrap");
  const availW=wrap.clientWidth-16, availH=wrap.clientHeight-16;
  const gw=state.w*T, gh=state.h*T;
  const scale=Math.min(availW/gw,availH/gh,1.6);
  cssW=Math.max(200,Math.floor(gw*scale)); cssH=Math.floor(gh*scale);
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.floor(gw*dpr*(cssW/gw)); cv.height=Math.floor(gh*dpr*(cssH/gh));
  cv.style.width=cssW+"px"; cv.style.height=cssH+"px";
}
window.addEventListener("resize",()=>{sizeCanvas();});
if(window.ResizeObserver) new ResizeObserver(()=>sizeCanvas()).observe(document.body);

function lerpVis(now){
  const dur=animT?animT.dur:120;
  let k=1;
  if(animT){ k=dur<=0?1:Math.min(1,(now-animT.t0)/dur); k=1-Math.pow(1-k,3); }
  const target={player:{x:state?state.player.x:0,y:state?state.player.y:0},guards:state?state.guards.map(g=>({x:g.pos[0],y:g.pos[1]})):[]};
  const sp=reduced?1:k;
  vis.player.x+=(target.player.x-vis.player.x)*sp;
  vis.player.y+=(target.player.y-vis.player.y)*sp;
  target.guards.forEach((g,i)=>{ if(!vis.guards[i]) vis.guards[i]={...g};
    vis.guards[i].x+=(g.x-vis.guards[i].x)*sp; vis.guards[i].y+=(g.y-vis.guards[i].y)*sp; });
  if(animT&&now-animT.t0>=dur) animT=null;
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function burst(x,y,color){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2, v=0.6+Math.random()*1.6;
    particles.push({x:x*T+T/2,y:y*T+T/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.6,life:1,color});
  }
}
function drawParticles(dt){
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx*dt*0.06; p.y+=p.vy*dt*0.06; p.vy+=dt*0.004; p.life-=dt/600;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
}

function draw(now){
  requestAnimationFrame(draw);
  if(!state||!$("game").classList.contains("active")) return;
  const dt=Math.min(50,now-(draw.last||now)); draw.last=now;
  lerpVis(now);
  ctx.setTransform(cv.width/(state.w*T),0,0,cv.height/(state.h*T),0,0);
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake=Math.max(0,shake-dt*0.04); }

  /* floor & walls */
  for(let y=0;y<state.h;y++)for(let x=0;x<state.w;x++){
    const k=x+","+y;
    if(state.base.walls.has(k)){
      ctx.fillStyle="#060e17"; ctx.fillRect(x*T,y*T,T,T);
      ctx.fillStyle="#0c1e30"; ctx.fillRect(x*T+2,y*T+2,T-4,T-4);
      ctx.fillStyle="#2a5a86"; ctx.fillRect(x*T+2,y*T+2,T-4,3);
      ctx.fillStyle="#122c44"; ctx.fillRect(x*T+2,y*T+T-5,T-4,3);
    }else{
      ctx.fillStyle=(x+y)%2?"#122a42":"#142e48";
      ctx.fillRect(x*T,y*T,T,T);
    }
  }
  /* exit */
  drawExit(now);
  /* watched cells */
  drawBeams(now);
  /* vitrines */
  for(let y=0;y<state.h;y++)for(let x=0;x<state.w;x++){
    if(state.base.vitrines.has(x+","+y)) drawVitrine(x,y);
  }
  /* objects */
  for(const o of state.objects) if(!o.got) drawGem(o,now);
  /* guards */
  state.guards.forEach((g,i)=>drawGuard(g,i,now));
  /* player */
  drawCreature(now);
  /* particles + capture fx */
  drawParticles(dt);
  if(captureFx&&now-captureFx.t<650){
    ctx.fillStyle="rgba(255,90,80,"+(0.30*(1-(now-captureFx.t)/650))+")";
    ctx.fillRect(0,0,state.w*T,state.h*T);
  }
  if(wonFx&&now-wonFx.t<800){
    ctx.fillStyle="rgba(88,230,168,"+(0.22*(1-(now-wonFx.t)/800))+")";
    ctx.fillRect(0,0,state.w*T,state.h*T);
  }
  /* vignette */
  const vg=ctx.createRadialGradient(state.w*T/2,state.h*T/2,Math.min(state.w,state.h)*T*0.35,state.w*T/2,state.h*T/2,Math.max(state.w,state.h)*T*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(2,8,14,0.55)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,state.w*T,state.h*T);

  if(DEBUG) drawDebug();
}
const DEBUG=new URLSearchParams(location.search).has("debug");
function drawDebug(){
  ctx.fillStyle="#9fe3ff"; ctx.font="10px monospace"; ctx.globalAlpha=0.7;
  for(let y=0;y<state.h;y++)for(let x=0;x<state.w;x++) ctx.fillText(x+","+y,x*T+3,y*T+11);
  ctx.globalAlpha=1;
  ctx.fillStyle="#9fe3ff"; ctx.font="12px monospace";
  ctx.fillText("t"+state.turn+" m"+state.moves+" "+state.status+" decoy"+state.decoy+" g["+state.guards.map(g=>g.idx+":"+g.facing+(g.distract?":z"+g.distract:"")).join(" ")+"]",6,state.h*T-6);
}
function drawExit(now){
  const e=state.exit, open=state.gotMask===state.fullMask;
  const x=e.x*T,y=e.y*T;
  ctx.fillStyle="#081a28"; ctx.fillRect(x+6,y+4,T-12,T-8);
  if(open){
    const pulse=0.55+0.25*Math.sin(now/300);
    const g=ctx.createRadialGradient(x+T/2,y+T/2,3,x+T/2,y+T/2,T*0.75);
    g.addColorStop(0,"rgba(88,230,168,"+(0.55*pulse+0.3)+")"); g.addColorStop(1,"rgba(88,230,168,0)");
    ctx.fillStyle=g; ctx.fillRect(x-T/2,y-T/2,T*2,T*2);
    ctx.strokeStyle="#58e6a8"; ctx.lineWidth=2.5;
    rr(x+8,y+6,T-16,T-12,7); ctx.stroke();
    ctx.fillStyle="rgba(88,230,168,"+(0.5+0.3*Math.sin(now/250))+")";
    rr(x+12,y+10,T-24,T-20,5); ctx.fill();
  }else{
    ctx.strokeStyle="#2c5170"; ctx.lineWidth=2;
    rr(x+8,y+6,T-16,T-12,7); ctx.stroke();
    const missing=state.objects.filter(o=>!o.got).length;
    for(let i=0;i<missing;i++){
      ctx.fillStyle="#3d5d79";
      ctx.beginPath(); ctx.arc(x+T/2+(i-(missing-1)/2)*9,y+T/2,3,0,7); ctx.fill();
    }
  }
}
function drawBeams(now){
  const rays=watchedBy(state);
  state.guards.forEach((g,gi)=>{
    const ray=rays[gi];
    if(!ray.length) return;
    const [dx,dy]=DIRS[g.facing];
    const gv=vis.guards[gi]||{x:g.pos[0],y:g.pos[1]};
    const sx=gv.x*T+T/2, sy=gv.y*T+T/2;
    const last=ray[ray.length-1];
    const ex=last[0]*T+T/2+dx*T/2, ey=last[1]*T+T/2+dy*T/2;
    const flick=0.85+0.15*Math.sin(now/170+gi*2.1);
    /* cells tint */
    for(const [cx,cy] of ray){
      ctx.fillStyle="rgba(196,222,248,"+(0.13*flick)+")";
      ctx.fillRect(cx*T,cy*T,T,T);
      ctx.strokeStyle="rgba(220,238,255,0.16)"; ctx.lineWidth=1;
      ctx.strokeRect(cx*T+0.5,cy*T+0.5,T-1,T-1);
    }
    /* cone */
    const grad=ctx.createLinearGradient(sx,sy,ex,ey);
    grad.addColorStop(0,"rgba(214,234,255,"+(0.30*flick)+")");
    grad.addColorStop(1,"rgba(214,234,255,0.02)");
    const px=-dy, py=dx; // perpendicular
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(sx+px*5,sy+py*5);
    ctx.lineTo(ex+px*T*0.46,ey+py*T*0.46);
    ctx.lineTo(ex-px*T*0.46,ey-py*T*0.46);
    ctx.lineTo(sx-px*5,sy-py*5);
    ctx.closePath(); ctx.fill();
  });
}
function drawVitrine(x,y){
  const px=x*T, py=y*T;
  /* warm halo */
  const g=ctx.createRadialGradient(px+T/2,py+T/2,4,px+T/2,py+T/2,T*0.8);
  g.addColorStop(0,"rgba(255,217,138,0.20)"); g.addColorStop(1,"rgba(255,217,138,0)");
  ctx.fillStyle=g; ctx.fillRect(px-T/3,py-T/3,T*1.66,T*1.66);
  /* glass box */
  ctx.fillStyle="rgba(150,205,240,0.13)";
  rr(px+6,py+5,T-12,T-10,5); ctx.fill();
  ctx.strokeStyle="rgba(190,225,250,0.55)"; ctx.lineWidth=1.6;
  rr(px+6,py+5,T-12,T-10,5); ctx.stroke();
  /* artifact silhouette */
  ctx.fillStyle="rgba(120,170,210,0.5)";
  ctx.beginPath();
  ctx.moveTo(px+T/2-4,py+11);
  ctx.quadraticCurveTo(px+T/2-9,py+20,px+T/2-5,py+T-13);
  ctx.lineTo(px+T/2+5,py+T-13);
  ctx.quadraticCurveTo(px+T/2+9,py+20,px+T/2+4,py+11);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(px+T/2-7,py+9,14,3);
  /* gold base */
  ctx.fillStyle="#d9a441"; ctx.fillRect(px+5,py+T-8,T-10,4);
  ctx.fillStyle="#8a6420"; ctx.fillRect(px+5,py+T-4,T-10,2);
  /* glint */
  ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(px+10,py+T-12); ctx.lineTo(px+T-14,py+10); ctx.stroke();
}
function drawGem(o,now){
  const cx=o.x*T+T/2, cy=o.y*T+T/2+Math.sin(now/380+o.i)*2.2;
  const c=GEMCOLORS[o.i%GEMCOLORS.length];
  const g=ctx.createRadialGradient(cx,cy,1,cx,cy,T*0.6);
  g.addColorStop(0,c+"88"); g.addColorStop(1,c+"00");
  ctx.fillStyle=g; ctx.fillRect(cx-T,cy-T,T*2,T*2);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(now/600+o.i)*0.25);
  ctx.fillStyle=c;
  ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(8,0); ctx.lineTo(0,11); ctx.lineTo(-8,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.75)";
  ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(4,-3); ctx.lineTo(-3,-2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawGuard(g,gi,now){
  const v=vis.guards[gi]||{x:g.pos[0],y:g.pos[1]};
  const cx=v.x*T+T/2, cy=v.y*T+T/2+Math.sin(now/500+gi)*1.2;
  const [dx,dy]=DIRS[g.facing];
  ctx.save(); ctx.translate(cx,cy);
  /* body */
  ctx.fillStyle=g.distract>0?"#26455f":"#1d3752";
  ctx.beginPath(); ctx.arc(0,2,14,0,7); ctx.fill();
  ctx.strokeStyle="#d9a441"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,2,14,0,7); ctx.stroke();
  /* cap pointing to facing */
  ctx.save(); ctx.rotate(Math.atan2(dy,dx));
  ctx.fillStyle=g.distract>0?"#3c6d8f":"#c94f4f";
  ctx.beginPath(); ctx.arc(0,0,10.5,Math.PI*0.75,Math.PI*2.25); ctx.closePath(); ctx.fill();
  ctx.fillRect(6,-7,7,4); /* brim */
  ctx.restore();
  /* face */
  const ex=dx*3.4, ey=dy*3.4;
  if(g.distract>0){
    /* charmed eyes + lure */
    ctx.fillStyle="#ffe9b3";
    for(const s of [-5,5]){ ctx.beginPath(); ctx.arc(s,-1,3.4,0,7); ctx.fill(); }
    ctx.fillStyle="#b4761d";
    ctx.beginPath(); ctx.arc(-5,-1,1.6,0,7); ctx.arc(5,-1,1.6,0,7); ctx.fill();
    ctx.fillStyle="#ffd98a";
    ctx.save(); ctx.translate(0,-15+Math.sin(now/160)*1.5); ctx.rotate(now/300);
    ctx.beginPath(); for(let i=0;i<5;i++){ const a=-Math.PI/2+i*Math.PI*2/5;
      ctx.lineTo(Math.cos(a)*5,Math.sin(a)*5);
      const a2=a+Math.PI/5; ctx.lineTo(Math.cos(a2)*2.2,Math.sin(a2)*2.2); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }else{
    ctx.fillStyle="#eef6fc";
    ctx.beginPath(); ctx.arc(-5+ex*0.4,-1+ey*0.4,4.4,0,7); ctx.arc(5+ex*0.4,-1+ey*0.4,4.4,0,7); ctx.fill();
    ctx.fillStyle="#132437";
    ctx.beginPath(); ctx.arc(-5+ex,-1+ey,2,0,7); ctx.arc(5+ex,-1+ey,2,0,7); ctx.fill();
    /* brow */
    ctx.strokeStyle="#0e1c2b"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-9,-7); ctx.lineTo(-2,-5); ctx.moveTo(9,-7); ctx.lineTo(2,-5); ctx.stroke();
  }
  /* alert bubble while capturing */
  if(captureFx&&now-captureFx.t<700){
    ctx.fillStyle="#ff6b5e";
    ctx.font="bold 20px Georgia"; ctx.textAlign="center";
    ctx.fillText("!",0,-16);
  }
  ctx.restore();
}
function drawCreature(now){
  const cx=vis.player.x*T+T/2, cy=vis.player.y*T+T/2+Math.sin(now/320)*1.6;
  ctx.save(); ctx.translate(cx,cy);
  const g=ctx.createRadialGradient(cx,cy,2,cx,cy,T*0.7);
  ctx.fillStyle="rgba(111,224,184,0.14)";
  ctx.beginPath(); ctx.arc(0,0,T*0.62,0,7); ctx.fill();
  /* wings */
  const flap=reduced?0:Math.sin(now/140)*0.5;
  ctx.fillStyle="rgba(111,224,184,0.55)";
  for(const s of [-1,1]){
    ctx.save(); ctx.scale(s,1); ctx.rotate(-0.5+flap);
    ctx.beginPath(); ctx.ellipse(11,-4,8,4.5,0.5,0,7); ctx.fill(); ctx.restore();
  }
  /* body */
  ctx.fillStyle="#6fe0b8";
  ctx.beginPath(); ctx.ellipse(0,1,9.5,11,0,0,7); ctx.fill();
  ctx.fillStyle="#a9f0d6";
  ctx.beginPath(); ctx.ellipse(0,5,5.5,6,0,0,7); ctx.fill();
  /* ears */
  ctx.fillStyle="#6fe0b8";
  ctx.beginPath(); ctx.moveTo(-7,-8); ctx.lineTo(-10,-16); ctx.lineTo(-2,-10); ctx.closePath();
  ctx.moveTo(7,-8); ctx.lineTo(10,-16); ctx.lineTo(2,-10); ctx.closePath(); ctx.fill();
  /* eyes */
  ctx.fillStyle="#0d2b22";
  ctx.beginPath(); ctx.arc(-3.6,-3,2.8,0,7); ctx.arc(3.6,-3,2.8,0,7); ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath(); ctx.arc(-2.7,-3.9,1,0,7); ctx.arc(4.5,-3.9,1,0,7); ctx.fill();
  ctx.restore();
}

/* ---------- input ---------- */
const KEYMAP={ArrowUp:"N",ArrowDown:"S",ArrowLeft:"W",ArrowRight:"E",
  w:"N",W:"N",z:"N",Z:"N",s:"S",S:"S",a:"W",A:"W",q:"W",Q:"W",d:"E",D:"E"};
window.addEventListener("keydown",e=>{
  if(e.repeat||performance.now()<inputLockUntil){ if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault(); return; }
  if(!$("game").classList.contains("active")){ if(e.key==="Enter"&&$("home").classList.contains("active")){e.preventDefault();playBtn();} return; }
  const mv=KEYMAP[e.key];
  if(mv){ e.preventDefault(); doAction({t:"move",dx:DIRS[mv][0],dy:DIRS[mv][1]}); }
  else if(e.key===" "){ e.preventDefault(); doAction({t:"wait"}); }
  else if(e.key==="l"||e.key==="L"||e.key==="x"||e.key==="X"){ e.preventDefault(); doAction({t:"decoy"}); }
  else if(e.key==="u"||e.key==="U"){ e.preventDefault(); undo(); }
  else if(e.key==="r"||e.key==="R"){ e.preventDefault(); startLevel(curLevel); }
  else if(e.key==="Escape"){ show("levels"); renderLevels(); }
});
document.querySelectorAll("#dpad button[data-mv]").forEach(b=>{
  const fire=e=>{ e.preventDefault(); const mv=b.getAttribute("data-mv"); doAction({t:"move",dx:DIRS[mv][0],dy:DIRS[mv][1]}); };
  b.addEventListener("pointerdown",fire);
});
function bindTap(id,fn){ const el=$(id); el.addEventListener("pointerdown",e=>{e.preventDefault();fn();}); }
bindTap("btnWait",()=>doAction({t:"wait"}));
bindTap("btnDecoy",()=>doAction({t:"decoy"}));
bindTap("btnUndo",undo);
bindTap("btnRestart",()=>{SFX.click();startLevel(curLevel);});
bindTap("btnHome",()=>{SFX.click();renderLevels();show("levels");});
bindTap("btnRules2",()=>{SFX.click();show("rules");});
bindTap("btnRules",()=>{SFX.click();show("rules");});
bindTap("btnRulesBack",()=>{SFX.click();show(state?"game":"home");});
bindTap("btnLevels",()=>{SFX.click();renderLevels();show("levels");});
bindTap("btnLevelsBack",()=>{SFX.click();show("home");});
function playBtn(){ const i=Math.min(progress.unlocked,LEVELS.length-1); startLevel(i); }
bindTap("btnPlay",()=>{SFX.click();playBtn();});
function cycleLang(){ lang=lang==="en"?"fr":lang==="fr"?"es":"en"; store("musee.lang",lang); SFX.click(); applyLang(); }
bindTap("btnLang",cycleLang); bindTap("btnLang2",cycleLang);
function toggleSound(){ sound=!sound; store("musee.sound",sound); $("btnSound").textContent=$("btnSound2").textContent=sound?"🔊":"🔇"; $("btnSound2").classList.toggle("off",!sound); if(sound)SFX.click(); }
bindTap("btnSound",toggleSound); bindTap("btnSound2",toggleSound);
$("btnSound2").textContent=$("btnSound").textContent=sound?"🔊":"🔇";

/* decorative stars on home */
(function(){
  const s=$("home").querySelector(".stars"); let html="";
  for(let i=0;i<40;i++){ const x=Math.random()*100,y=Math.random()*55,z=Math.random();
    html+=`<div style="position:absolute;left:${x}%;top:${y}%;width:${z>0.8?3:2}px;height:${z>0.8?3:2}px;border-radius:50%;background:#cfe3f7;opacity:${0.15+z*0.5}"></div>`; }
  s.innerHTML=html;
})();

applyLang(); show("home");
requestAnimationFrame(draw);

/* QA/debug hook */
window.__musee={VERSION,LEVELS,PARS,parseLevel,initState,cloneState,applyAction,watchedBy,watchedSet,solve,I18N,
  get state(){return state;}, setLevel:startLevel, act:doAction, undo, progress:()=>progress,
  lang:()=>lang, setLang:l=>{lang=l;applyLang();}};
})();
}

/* headless/test hook */
if(typeof module!=="undefined"&&module.exports){ module.exports={VERSION,LEVELS,PARS,parseLevel,initState,cloneState,advanceGuard,guardRay,watchedBy,watchedSet,applyAction,solve,DIRS,rectPath,linePath,pingPong,I18N}; }
// hook headless : ne remplace jamais le hook UI (state/act/setLevel) déjà posé dans le navigateur
if(typeof globalThis!=="undefined"){
  const headless={VERSION,LEVELS,PARS,parseLevel,initState,cloneState,advanceGuard,guardRay,watchedBy,watchedSet,applyAction,solve,computePars,I18N};
  if(globalThis.__musee) Object.assign(globalThis.__musee,headless);
  else globalThis.__musee=headless;
}
